    <text x="238" y="218">4</text>
    <text x="328" y="198">9</text>
    <text x="418" y="170">16</text>
    <text x="508" y="134">25</text>
  </g>
  <g class="dim-label" text-anchor="middle">
    <text x="50" y="256">start</text>
    <text x="140" y="256">1</text>
    <text x="230" y="256">2</text>
    <text x="320" y="256">3</text>
