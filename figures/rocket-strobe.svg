    <circle cx="140" cy="222" r="6"/>
    <circle cx="230" cy="198" r="6"/>
    <circle cx="320" cy="158" r="6"/>
    <circle cx="410" cy="102" r="6"/>
    <circle cx="500" cy="30" r="6"/>
